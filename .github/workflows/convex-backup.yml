name: Convex backup

# Nightly offsite copy of the production Convex data (tables + file storage),
# encrypted and uploaded to OneDrive. Setup and restore steps: docs/backups.md.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and upload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_SERVER_KEY: ${{ secrets.CONVEX_SERVER_KEY }}
      API_URL: ${{ secrets.API_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export production data
        working-directory: packages/convex
        run: bunx convex export --include-file-storage --path "$RUNNER_TEMP/convex.zip"

      - name: Encrypt
        run: |
          sudo apt-get install -y age
          name="convex-$(date -u +%Y-%m-%d).zip.age"
          age -r "$BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/$name" "$RUNNER_TEMP/convex.zip"
          rm "$RUNNER_TEMP/convex.zip"
          echo "BACKUP_FILE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Upload to OneDrive
        run: bun scripts/upload-backup.ts "$BACKUP_FILE"

      - name: Record the failure
        if: failure()
        run: bun scripts/upload-backup.ts --failed
